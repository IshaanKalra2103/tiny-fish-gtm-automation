[project]
name = "mstools"
version = "0.1.0"
description = "Tool CLIs the MainStreet AI sandbox agent calls"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "httpx>=0.27",
    "tinyfish>=0.9.0",
    "agentmail>=2.0.15",
]


[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
ws = "mstools.ws:main"
catalog = "mstools.catalog:main"
approval = "mstools.approval:main"
tf = "mstools.tf:main"
inbox = "mstools.inbox:main"
preview = "mstools.preview:main"

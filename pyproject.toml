[project]
name = "mainstreet-ai"
version = "0.1.0"
description = "MainStreet AI: discover, compare and adopt vetted AI tools for Main Street small businesses"
requires-python = ">=3.12"
dependencies = ["mstools", "mscatalog", "msapi"]

[tool.uv]
package = false

[tool.uv.sources]
mstools = { workspace = true }
mscatalog = { workspace = true }
msapi = { workspace = true }

[tool.uv.workspace]
members = ["sandbox/tools", "catalog", "api"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["sandbox/tools/tests", "catalog/tests", "api/tests", "scripts/tests"]

[project]
name = "bd-gateway"
version = "0.1.0"
description = "Bright Data social data gateway (TikTok, Instagram Reels, YouTube, Reddit) for the GTM harness"
readme = "README.md"
authors = [
    { name = "Ishaan Kalra", email = "74290686+IshaanKalra2103@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
bd-gateway = "bd_gateway:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project]
name = "gtm"
version = "0.1.0"
description = "Agent-led growth loop on TinyFish: trend research -> template -> short video -> persona QA -> approval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tinyfish>=0.9.0",
    "openai>=3.29.0",
    "pydantic>=2.10",
    "moviepy==2.2.1",
    "pillow>=11.3.0",
    "playwright>=1.63.0",
    "python-dotenv>=1.0",
]

[project.scripts]
gtm = "gtm.cli:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[project]
name = "ms-waker"
version = "0.1.0"
description = "MainStreet AI waker: public Cloud Run front for the agent VM; starts it on demand and streams requests to it"
requires-python = ">=3.12"
dependencies = ["starlette>=0.40", "httpx>=0.27", "uvicorn>=0.32"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

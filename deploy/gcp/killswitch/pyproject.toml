[project]
name = "ms-killswitch"
version = "0.1.0"
description = "Disables billing on the MainStreet AI project when the $200 budget is reached"
requires-python = ">=3.12"
dependencies = ["functions-framework>=3,<4", "google-cloud-billing>=1,<2"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

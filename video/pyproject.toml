[project]
name = "vidgen"
version = "0.1.0"
description = "Short-form video generation for the GTM harness: ElevenLabs voice, Bing images, gameplay, ffmpeg"
readme = "README.md"
authors = [
    { name = "Ishaan Kalra", email = "74290686+IshaanKalra2103@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=11.0",
    "python-dotenv>=1.0",
]

[project.scripts]
vidgen = "vidgen:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

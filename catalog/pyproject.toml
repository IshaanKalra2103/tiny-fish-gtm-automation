[project]
name = "mscatalog"
version = "0.1.0"
description = "Offline pipeline that discovers, vets and exports the MainStreet AI tool catalog"
requires-python = ">=3.12"
dependencies = ["mstools", "pyyaml>=6.0"]

[project.scripts]
mscatalog = "mscatalog.cli:main"

[tool.uv.sources]
mstools = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
